# Recetario: https://recetas.criollos.tech → contenedor app en 127.0.0.1:3015
# Va en /etc/nginx/sites-enabled/recetas.criollos.tech
# Certificado: certbot certonly --webroot -w /var/www/html -d recetas.criollos.tech --deploy-hook "systemctl reload nginx"

server {
    listen 80;
    listen [::]:80;
    server_name recetas.criollos.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recetas.criollos.tech;

    ssl_certificate     /etc/letsencrypt/live/recetas.criollos.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recetas.criollos.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RecetasSSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
